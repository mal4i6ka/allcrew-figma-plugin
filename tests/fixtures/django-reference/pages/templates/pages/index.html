{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Figma-to-Django Reference Stand</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'pages/css/tokens.css' %}">
</head>
<body>
  <div class="container py-5">
    {% if visible %}
    <div class="card" style="background: var(--color-background); color: var(--color-text); padding: var(--spacing-md); gap: var(--spacing-sm);">
      <h2 class="card__title" style="font-family: var(--font-family-base); font-size: var(--font-size-heading);">{{ title }}</h2>
    </div>
    {% endif %}
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
