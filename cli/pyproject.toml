[project]
name = "allcrew-channel"
version = "0.2.0"
description = "Terminal companion for the AllCrew Figma Workspace plugin: apply packages, merge PO catalogs, rebuild token files, vendor Bootstrap, run checks."
requires-python = ">=3.11"
license = { text = "Proprietary" }

[project.scripts]
allcrew-channel = "allcrew_channel.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["allcrew_channel"]
